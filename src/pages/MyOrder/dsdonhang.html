<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách đơn hàng</title>
    <link rel="stylesheet" href="dsdonhang.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="orders-container">
        <h1 class="order-h1">Đơn hàng của tôi</h1>

        <ul class="order-list">


            <li class="order-card">

                <a href="http://127.0.0.1:5500/chitietdh.html" class="order-card-link">

                    <div class="order-image">
                        <img src="https://via.placeholder.com/100x120/EFEFEF/AAAAAA&text=Ao+Thun" alt="Áo thun basic">
                    </div>


                    <div class="order-details">
                        <div class="order-header">
                            <span class="order-id">#DH202311A</span>
                            <span class="order-status status-shipping">Đang vận chuyển</span>
                        </div>
                        <div class="order-summary">
                            <p>Áo Thun Basic Cotton và 2 sản phẩm khác</p>
                        </div>
                        <div class="order-footer">
                            <span class="order-total">Tổng tiền: <strong>750.000đ</strong></span>
                        </div>
                    </div>
                </a>
            </li>


            <li class="order-card">
                <a href="#link-toi-trang-chi-tiet-don-hang-2" class="order-card-link">
                    <div class="order-image">
                        <img src="https://via.placeholder.com/100x120/EFEFEF/AAAAAA&text=Quan+Jean" alt="Quần Jean">
                    </div>
                    <div class="order-details">
                        <div class="order-header">
                            <span class="order-id">#DH202310B</span>
                            <span class="order-status status-delivered">Đã giao</span>
                        </div>
                        <div class="order-summary">
                            <p>Quần Jean Dáng Suông</p>
                        </div>
                        <div class="order-footer">
                            <span class="order-total">Tổng tiền: <strong>520.000đ</strong></span>
                        </div>
                    </div>
                </a>
            </li>


            <li class="order-card">
                <a href="#link-toi-trang-chi-tiet-don-hang-3" class="order-card-link">
                    <div class="order-image">
                        <img src="https://via.placeholder.com/100x120/EFEFEF/AAAAAA&text=Vay+Hoa" alt="Váy hoa">
                    </div>
                    <div class="order-details">
                        <div class="order-header">
                            <span class="order-id">#DH202309C</span>
                            <span class="order-status status-cancelled">Đã hủy</span>
                        </div>
                        <div class="order-summary">
                            <p>Váy Hoa Nhí Vintage</p>
                        </div>
                        <div class="order-footer">
                            <span class="order-total">Tổng tiền: <strong>480.000đ</strong></span>
                        </div>
                    </div>
                </a>
            </li>

        </ul>
    </div>

</body>

</html>
