<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot UI</title>
    <link rel="stylesheet" href="chatbot.css">
    <!-- Link đến thư viện icon của Google (Material Symbols) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
</head>
<body>

    <!-- Nút bấm để bật/tắt chatbot -->
    <button class="chatbot-toggler">
        <span class="material-symbols-outlined">mode_comment</span>
        <span class="material-symbols-outlined">close</span>
    </button>

    <!-- Cửa sổ Chatbot -->
    <div class="chatbot">
        <header>
            <h2>Chatbot</h2>
            <span class="close-btn material-symbols-outlined">close</span>
        </header>
        <ul class="chatbox">
            <!-- Tin nhắn của bot (mẫu) -->
            <li class="chat incoming">
                <span class="material-symbols-outlined">smart_toy</span>
                <p>Xin chào! 👋<br>Tôi có thể giúp gì cho bạn?</p>
            </li>
            <!-- Tin nhắn của người dùng (mẫu) -->
            <!-- <li class="chat outgoing">
                <p>Chào bạn, tôi cần tư vấn về sản phẩm.</p>
            </li> -->
        </ul>
        <div class="chat-input">
            <textarea placeholder="Nhập tin nhắn..." required></textarea>
            <span id="send-btn" class="material-symbols-outlined">send</span>
        </div>
    </div>
    <script src="chatbot.js" defer></script>
</body>
</html>
